# Builds the signed .bin packages for every My Cloud OS5 model.
# The packaging/signing tool (mksapkg-OS5) is an x86_64 Linux binary from the
# WD Community wdpksrc project, so the build runs on a GitHub-hosted runner.
name: Build apkg packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2 openssl

      - name: Fetch mksapkg-OS5 (WD Community, pinned commit + checksum)
        run: |
          curl -fsSL -o mksapkg-OS5 https://raw.githubusercontent.com/WDCommunity/wdpksrc/f72c74ad046ce44fe0a86452e14f5c0eff3226b8/mksapkg-OS5
          echo "62340b1d0eb0433fffa7ceb1a5b6d4886e69b93e6e60297b2f984f5f3557e67a  mksapkg-OS5" | sha256sum -c -
          chmod +x mksapkg-OS5

      - name: Tag must match apkg.rc version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(awk '/^Version:/{print $NF}' tailscale/apkg.rc)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != apkg.rc version $v"; exit 1; }

      - name: Enable OpenSSL legacy provider for mksapkg's Blowfish signing
        # mksapkg-OS5 signs with 'openssl bf-cbc'. OpenSSL 3 (Ubuntu runners)
        # only offers Blowfish through the legacy provider, otherwise the
        # signature file is cut short and the NAS reports "signature failed".
        run: |
          mkdir -p "$HOME/shim"
          cat > "$HOME/shim/openssl" <<'EOS'
          #!/bin/sh
          case "$1" in
            bf-cbc|bf|enc) exec /usr/bin/openssl "$@" -provider legacy -provider default ;;
            *) exec /usr/bin/openssl "$@" ;;
          esac
          EOS
          chmod +x "$HOME/shim/openssl"
          echo "$HOME/shim" >> "$GITHUB_PATH"
          "$HOME/shim/openssl" version
          echo test | "$HOME/shim/openssl" bf-cbc -md sha256 -k x | wc -c

      - name: desc.xml must match its template
        run: python3 tools/gen-desc.py --check

      - name: Build packages
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailscale-apkg
          path: packages/*.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tailscale-apkg
          path: packages
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: packages/*.bin
          generate_release_notes: true
